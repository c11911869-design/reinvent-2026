<title>Mission Track</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F7F9;
  --ink:#0E1319; --ink-2:#333C48; --muted:#5A6472; --faint:#8A93A0;
  --rule:#D2D8E0; --rule-soft:#E2E7EC;
  --accent:#0B5D7A;
  --t-mission:#B03A2E; --t-train:#0B5D7A; --t-mlops:#6A4C93; --t-physical:#1E7A5E;
  --t-hpc:#8C6210; --t-data:#2A5CA8; --t-build:#B85C22; --t-rigor:#414B5C;
  --shadow:0 1px 2px rgba(14,19,25,.06), 0 1px 8px rgba(14,19,25,.04);
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --disp:"Archivo","Public Sans",-apple-system,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1116; --surface:#151A21; --surface-2:#1B222B;
  --ink:#EAEEF3; --ink-2:#C2CAD4; --muted:#96A1AF; --faint:#6D7887;
  --rule:#2A323D; --rule-soft:#222932;
  --accent:#5BB2CE;
  --t-mission:#E07A63; --t-train:#5BB2CE; --t-mlops:#A891DC; --t-physical:#57C295;
  --t-hpc:#D7A63C; --t-data:#7BA6E8; --t-build:#E79554; --t-rigor:#9AA6B8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 10px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#0D1116; --surface:#151A21; --surface-2:#1B222B;
  --ink:#EAEEF3; --ink-2:#C2CAD4; --muted:#96A1AF; --faint:#6D7887;
  --rule:#2A323D; --rule-soft:#222932;
  --accent:#5BB2CE;
  --t-mission:#E07A63; --t-train:#5BB2CE; --t-mlops:#A891DC; --t-physical:#57C295;
  --t-hpc:#D7A63C; --t-data:#7BA6E8; --t-build:#E79554; --t-rigor:#9AA6B8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--rule);background:var(--surface);}
.mast-in{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;
  justify-content:space-between;padding-top:38px;padding-bottom:26px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,4.6vw,46px);
  line-height:1.02;letter-spacing:-.021em;margin:0;text-wrap:balance;max-width:15ch}
.sub{margin:14px 0 0;max-width:56ch;color:var(--ink-2);font-size:15.5px}
.tally{display:flex;gap:0;border:1px solid var(--rule);background:var(--surface-2);
  border-radius:3px;overflow:hidden;flex:0 0 auto}
.tally div{padding:12px 20px;border-right:1px solid var(--rule);text-align:right}
.tally div:last-child{border-right:0}
.tally b{display:block;font-family:var(--mono);font-weight:600;font-size:23px;
  line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tally span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- controls ---------- */
.rail{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule);box-shadow:var(--shadow)}
.rail-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-top:12px;padding-bottom:12px}
.search{flex:1 1 220px;min-width:180px;position:relative}
.search input{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;
  padding:8px 11px 8px 30px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:5px 10px;border:1px solid var(--rule);background:var(--surface);
  color:var(--muted);border-radius:2px;cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip.t[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:#fff}
.chip.day{display:inline-flex;align-items:baseline;gap:7px}
.chip.day .dn{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.chip.day[aria-pressed="true"] .dn{color:inherit;opacity:.75}
:root[data-theme="dark"] .chip.t[aria-pressed="true"],
:root:not([data-theme="light"]) .chip.t[aria-pressed="true"]{color:#0D1116}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .chip.t[aria-pressed="true"]{color:#fff}}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.reset{font-family:var(--mono);font-size:11px;color:var(--accent);background:none;
  border:0;cursor:pointer;padding:4px 2px;text-decoration:underline;
  text-underline-offset:3px}
.divider{width:1px;align-self:stretch;background:var(--rule);margin:2px 2px}

/* ---------- legend / track sections ---------- */
main{padding:34px 0 60px}
.sect{margin:0 0 40px;scroll-margin-top:120px}
.sect-head{display:flex;align-items:baseline;gap:14px;padding-bottom:9px;
  border-bottom:3px solid var(--lc);margin-bottom:4px}
.sect-head h2{font-family:var(--disp);font-weight:700;font-size:19px;
  letter-spacing:-.008em;margin:0;color:var(--ink)}
.sect-head .n{font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-left:auto}
.sect-desc{color:var(--muted);font-size:13.5px;margin:9px 0 18px;max-width:74ch}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:3px;
  padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;
  transition:border-color .14s, box-shadow .14s}
.card:hover{border-color:var(--rule);box-shadow:var(--shadow)}
.card.core{border-left:3px solid var(--lc);padding-left:14px}
.card.on{background:var(--surface-2);border-color:var(--lc)}
.c-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.code{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.03em;
  color:var(--lc)}
.lvl{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:1px 5px;
  font-variant-numeric:tabular-nums}
.star{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--lc);border:1px solid currentColor;border-radius:2px;padding:1px 5px}
.c-title{font-family:var(--disp);font-weight:600;font-size:15.5px;line-height:1.26;
  letter-spacing:-.006em;margin:0;color:var(--ink);text-wrap:balance}
.c-note{font-size:13.5px;line-height:1.52;color:var(--ink-2);margin:0}
.c-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;
  padding-top:9px;border-top:1px solid var(--rule-soft)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted);
  text-transform:uppercase}
.tag.hands{color:var(--lc)}
.plan{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;background:none;border:1px solid var(--rule);
  border-radius:2px;color:var(--muted);padding:3px 9px;cursor:pointer;transition:.14s}
.plan:hover{border-color:var(--lc);color:var(--lc)}
.plan[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:var(--surface)}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);background:var(--surface);padding:30px 0 46px}
.fgrid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
footer h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:500}
footer p, footer li{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 8px}
footer ul{margin:0;padding-left:17px}
footer a{color:var(--accent)}
.fnote{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.65}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- view toggle ---------- */
.vtog{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex:0 0 auto}
.vtog button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 13px;background:var(--surface);border:0;border-right:1px solid var(--rule);
  color:var(--muted);cursor:pointer;transition:.14s}
.vtog button:last-child{border-right:0}
.vtog button:hover{color:var(--ink)}
.vtog button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* ---------- day view ---------- */
.daytabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;
  border-bottom:1px solid var(--rule);padding-bottom:0}
.daytab{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:-.004em;
  background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  padding:8px 4px 9px;cursor:pointer;display:flex;align-items:baseline;gap:8px;transition:.14s}
.daytab:hover{color:var(--ink)}
.daytab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.daytab .dn{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--faint);
  font-variant-numeric:tabular-nums}
.daytab[aria-pressed="true"] .dn{color:var(--accent)}

.agenda{display:flex;flex-direction:column;gap:0}
.slotrow{display:grid;grid-template-columns:118px 1fr;gap:0 18px;
  border-top:1px solid var(--rule-soft);padding:13px 0}
.slotrow:last-child{border-bottom:1px solid var(--rule-soft)}
.slotrow.on{background:var(--surface)}
.when{font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;
  line-height:1.5;padding-top:1px;white-space:nowrap}
.when b{font-weight:600;display:block}
.when span{display:block;color:var(--faint);font-size:10.5px}
.when span.dur{color:var(--muted)}
.what{display:flex;flex-direction:column;gap:5px;min-width:0}
.what .c-top{gap:8px}
.what h4{font-family:var(--disp);font-weight:600;font-size:14.5px;line-height:1.3;
  margin:0;color:var(--ink);letter-spacing:-.004em}
.where{font-family:var(--mono);font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.clash{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;background:var(--t-mission);border-radius:2px;padding:1px 6px}
:root[data-theme="dark"] .clash,:root:not([data-theme="light"]) .clash{color:#0D1116}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .clash{color:#fff}}
.rpt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--rule);border-radius:2px;padding:1px 5px}

/* ---------- pending panel ---------- */
.pending{border:1px solid var(--rule);background:var(--surface);border-radius:3px;
  padding:28px 30px;max-width:66ch;display:flex;flex-direction:column;gap:14px}
.pending h2{font-family:var(--disp);font-weight:700;font-size:20px;margin:0;
  letter-spacing:-.01em;color:var(--ink)}
.pending p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.62}
.pending ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;line-height:1.62}
.pending li{margin-bottom:5px}
.pending .stamp{font-family:var(--mono);font-size:11px;color:var(--faint);
  border-top:1px solid var(--rule-soft);padding-top:13px;line-height:1.6}
.pending code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
  border:1px solid var(--rule-soft);border-radius:2px;padding:1px 5px;color:var(--ink)}
@media (max-width:560px){
  .slotrow{grid-template-columns:1fr;gap:7px}
  .when{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .when b,.when span{display:inline}
  .pending{padding:22px 20px}
}


/* ---------- share / compare ---------- */
.share{border:1px solid var(--rule);background:var(--surface);border-radius:3px;
  padding:22px 24px;margin-bottom:30px;display:grid;gap:26px;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.share-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.share-col h3{font-family:var(--disp);font-weight:700;font-size:15px;margin:0;
  color:var(--ink);letter-spacing:-.006em}
.share-col p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.share input,.share textarea{width:100%;font-family:var(--mono);font-size:12px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--rule);
  border-radius:3px;padding:8px 10px;line-height:1.5;resize:vertical}
.share textarea{word-break:break-all}
.share input::placeholder,.share textarea::placeholder{color:var(--faint)}
.share-actions{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--ink);color:var(--ground);border:1px solid var(--ink);border-radius:3px;
  padding:7px 15px;cursor:pointer;transition:.14s}
.btn:hover{opacity:.85}
.btn.ghost{background:none;color:var(--muted);border-color:var(--rule)}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint);opacity:1}
.msg{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.45}
.msg.err{color:var(--t-mission)}
.msg.ok{color:var(--t-physical)}

.cmpbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--rule);border-left:3px solid var(--accent);
  background:var(--surface);border-radius:3px;padding:11px 15px;margin-bottom:22px}
.cmpbar .who{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
.cmpbar .stat{font-family:var(--mono);font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.cmpbar .stat b{color:var(--ink);font-weight:600}
.cmpbar .btn{margin-left:auto}

.both,.theirs{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;border-radius:2px;padding:1px 6px;white-space:nowrap;
  max-width:30ch;overflow:hidden;text-overflow:ellipsis}
.both{background:var(--t-physical);color:var(--surface)}
.theirs{border:1px solid var(--accent);color:var(--accent)}
@media (max-width:560px){.share{padding:18px 16px}}


/* ---------- onboarding ---------- */
.wiz{position:fixed;inset:0;z-index:200;background:var(--ground);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;padding:0 22px 60px}
.wiz-in{width:100%;max-width:760px}
.wiz-head{padding:52px 0 8px}
.wiz-head h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4vw,38px);
  letter-spacing:-.02em;margin:0 0 10px;color:var(--ink);text-wrap:balance}
.wiz-head p{margin:0;color:var(--ink-2);font-size:15px;max-width:56ch;line-height:1.6}
.steps{display:flex;gap:5px;margin:26px 0 30px}
.steps i{height:3px;flex:1;background:var(--rule);border-radius:2px;transition:.25s}
.steps i.on{background:var(--accent)}
.q{margin-bottom:6px}
.q h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:0 0 5px;
  color:var(--ink);letter-spacing:-.008em}
.q p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.55}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.opt{display:flex;align-items:baseline;gap:9px;text-align:left;padding:11px 13px;
  border:1px solid var(--rule);background:var(--surface);border-radius:3px;
  cursor:pointer;font-family:var(--sans);font-size:13.5px;color:var(--ink-2);
  transition:.14s;line-height:1.35}
.opt:hover{border-color:var(--faint);color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);
  color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .n{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.opt[aria-pressed="true"] .n{color:var(--accent)}
.wiz-nav{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.wiz-nav .msg{margin-left:auto}

/* ---------- for-you tiles ---------- */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tile{position:relative;background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:3px;padding:15px 16px 13px;display:flex;flex-direction:column;gap:8px;
  transition:border-color .14s,box-shadow .14s;text-align:left;cursor:pointer;
  font-family:var(--sans);color:var(--ink)}
.tile:hover{border-color:var(--rule);box-shadow:var(--shadow)}
.tile.on{background:var(--surface-2);border-color:var(--lc)}
.fit{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--lc);border:1px solid currentColor;border-radius:2px;padding:1px 6px}
.why{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.whenl{font-family:var(--mono);font-size:11px;color:var(--ink-2);line-height:1.5;margin:0;
  font-variant-numeric:tabular-nums}
.whenl b{color:var(--lc);font-weight:600}
.whenl .more{color:var(--faint)}
.whenl.tba{color:var(--faint)}
.dayhead{display:flex;align-items:baseline;gap:10px;font-family:var(--disp);font-weight:700;
  font-size:17px;color:var(--ink);margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.dayhead span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.dayhead .n{margin-left:auto}
.why b{color:var(--lc);font-weight:500}
.tile h3{font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.28;
  margin:0;letter-spacing:-.005em;text-wrap:balance}
.tile .ab{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0}

/* ---------- people ---------- */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  margin-bottom:30px}
.person{border:1px solid var(--rule-soft);background:var(--surface);border-radius:3px;
  padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.person.me{border-color:var(--accent);border-left-width:3px}
.person h4{font-family:var(--disp);font-weight:600;font-size:14.5px;margin:0;color:var(--ink)}
.person .stat{font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.person .stat b{color:var(--ink)}
.overlap{border-top:1px solid var(--rule-soft);margin-top:4px;padding-top:7px}
.namebar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;
  border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--surface);
  border-radius:3px;padding:13px 16px;margin-bottom:24px}

/* ---------- session drawer ---------- */
.scrim{position:fixed;inset:0;z-index:150;background:rgba(8,11,15,.5);
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:160;
  background:var(--ground);border-left:1px solid var(--rule);overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;padding:0 24px 48px}
.drawer.on{transform:none}
.drawer-head{position:sticky;top:0;background:var(--ground);padding:20px 0 14px;
  border-bottom:1px solid var(--rule);margin-bottom:20px;z-index:2}
.drawer-head h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:8px 0 0;
  color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.dclose{position:absolute;top:18px;right:0;font-family:var(--mono);font-size:11px;
  background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
  padding:4px 9px;cursor:pointer}
.dclose:hover{color:var(--ink);border-color:var(--faint)}
.dsec{margin-bottom:24px}
.dsec h3{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:0 0 9px;font-weight:500}
.dsec p{margin:0 0 9px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note{border:1px solid var(--rule-soft);background:var(--surface);border-radius:3px;
  padding:11px 13px;margin-bottom:8px}
.note .by{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px}
.note p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
.drawer textarea{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;
  padding:10px 12px;line-height:1.55;resize:vertical}
.summary{border:1px solid var(--accent);border-radius:3px;background:var(--surface-2);
  padding:13px 15px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.summary p{margin:0 0 8px}
.summary ul{margin:0 0 10px;padding-left:18px}
.summary li{margin-bottom:3px}
.summary h4{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink);margin:12px 0 6px}
.summary h4:first-child{margin-top:0}
.summary b{color:var(--ink)}

/* ---------- travel / conflicts ---------- */
.gap{display:flex;align-items:center;gap:9px;padding:5px 0 5px 12px;margin-left:52px;
  border-left:2px dotted var(--rule);font-family:var(--mono);font-size:10.5px;
  color:var(--muted);flex-wrap:wrap}
.gap.tight{color:var(--t-hpc);border-left-color:var(--t-hpc)}
.gap.bad{color:var(--t-mission);border-left-color:var(--t-mission)}
.advice{border:1px solid var(--rule);border-left:3px solid var(--t-hpc);
  background:var(--surface);border-radius:3px;padding:13px 15px;margin-bottom:16px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.advice b{color:var(--ink)}
.advice ul{margin:8px 0 0;padding-left:18px}
.advice li{margin-bottom:5px}
.sugg{margin:7px 0 4px;border:1px solid var(--rule-soft);border-radius:3px;background:var(--surface-2)}
.sugg summary{cursor:pointer;padding:7px 11px;font-family:var(--mono);font-size:11px;color:var(--accent);
  list-style-position:inside}
.sugg[open] summary{border-bottom:1px solid var(--rule-soft)}
.sugg ul{list-style:none;margin:0;padding:0}
.sugrow{display:grid;grid-template-columns:118px 1fr auto;gap:4px 14px;align-items:start;
  padding:9px 11px;border-top:1px solid var(--rule-soft);margin:0}
.sugrow:first-child{border-top:0}
.sugwhen{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.sugwhen span{display:block;color:var(--muted);font-size:10.5px}
.sugwhat{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0;font-size:13px}
.sugwhat .linkish{color:var(--ink);font-weight:600}
.sugfit{flex-basis:100%;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.advice.freetime{border-left-color:var(--accent)}
.advice.freetime > ul > li{margin-bottom:9px}
.sugg.none{margin:6px 0 2px;padding:0;border:0;background:none;font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.sugrow{grid-template-columns:1fr}}
@media (max-width:560px){.drawer{padding:0 16px 40px}.gap{margin-left:0}}

@media (max-width:640px){
  .mast-in{padding-top:26px;padding-bottom:20px}
  .rail{position:static}
  .wrap{padding:0 16px}
  .tally div{padding:9px 13px}
  .tally b{font-size:19px}
  .count{margin-left:0}
}
/* ---------- team coverage ---------- */
.cover{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--t-physical);border:1px solid currentColor;border-radius:2px;padding:1px 6px;
  white-space:nowrap;max-width:32ch;overflow:hidden;text-overflow:ellipsis}
.cover.me{background:var(--t-physical);border-color:var(--t-physical);color:var(--surface)}
.cover.open{color:var(--t-hpc)}
.teamstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  border:1px solid var(--rule);background:var(--surface);border-radius:3px;margin-bottom:30px}
.teamstats div{padding:12px 16px;border-right:1px solid var(--rule-soft)}
.teamstats div:last-child{border-right:0}
.teamstats b{display:block;font-family:var(--mono);font-weight:600;font-size:22px;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.teamstats span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.teamstats .warn b{color:var(--t-hpc)}
.duplist{display:flex;flex-direction:column}
.duprow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;
  border-top:1px solid var(--rule-soft);padding:13px 0}
.duprow:last-child{border-bottom:1px solid var(--rule-soft)}
.duprow .what{flex:1 1 320px}
.duprow .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.pchip{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--rule);border-radius:10px;padding:1px 9px;white-space:nowrap}
.pchip.me{border-color:var(--accent);color:var(--accent)}
.whererow{display:grid;grid-template-columns:118px 1fr;gap:0 18px;
  border-top:1px solid var(--rule-soft);padding:11px 0}
.whererow.dup{background:var(--surface)}
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;
  cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkish:hover{text-decoration-color:currentColor}
.notesess{border-top:1px solid var(--rule-soft);padding:14px 0 6px}
.notesess h4{font-family:var(--disp);font-weight:600;font-size:15px;margin:5px 0 8px;color:var(--ink)}
.drawer .plan,.duprow .plan{margin-left:0}
button:disabled{opacity:.5;cursor:default}
.namebar input{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:7px 10px}
#exOut{width:100%;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
@media (max-width:560px){.whererow{grid-template-columns:1fr;gap:5px}}
</style>
